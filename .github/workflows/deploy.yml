# CI/CD: build the Docker image, push it to ECR, and roll it out to ECS.
# Auth is GitHub OIDC (no long-lived credentials, no repo secrets).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Verify deployment variables are configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] || [ -z "${{ vars.AWS_REGION }}" ]; then
            echo "::error::Repository variables AWS_DEPLOY_ROLE_ARN and AWS_REGION are not set."
            echo "::error::Configure them under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (immutable SHA tag)
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          # One-time bootstrap: the ECR repo uses IMMUTABLE tags, so :latest can
          # only ever be pushed once. It exists solely so the first provisioning
          # of the ECS service has an image to start from; all real deploys use
          # the SHA tag above.
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag=latest >/dev/null 2>&1; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      id-token: write
      contents: read
    env:
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check whether the ECS service exists
        id: check-service
        run: |
          if [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_SERVICE" ]; then
            echo "ECS_CLUSTER/ECS_SERVICE variables not set - image pushed only"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[?status=='ACTIVE'].status" \
            --output text 2>/dev/null || true)

          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $ECS_SERVICE not provisioned yet - image pushed only"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Download the current task definition
        if: steps.check-service.outputs.exists == 'true'
        id: current-taskdef
        run: |
          TASKDEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text)
          echo "Current task definition: $TASKDEF_ARN"

          # describe-task-definition returns read-only fields that are not
          # valid RegisterTaskDefinition inputs; strip them before re-registering
          # (same list the deploy action's IGNORED_TASK_DEFINITION_ATTRIBUTES uses).
          aws ecs describe-task-definition \
            --task-definition "$TASKDEF_ARN" \
            --query taskDefinition | \
          jq 'del(.taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .deregisteredAt,
                  .registeredBy)' > task-definition.json

          CONTAINER_NAME=$(jq -r '.containerDefinitions[0].name' task-definition.json)
          echo "container-name=$CONTAINER_NAME" >> "$GITHUB_OUTPUT"

      - name: Render task definition with the new image
        if: steps.check-service.outputs.exists == 'true'
        id: render-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ steps.current-taskdef.outputs.container-name }}
          image: ${{ needs.build-push.outputs.image }}

      - name: Deploy to ECS
        if: steps.check-service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-taskdef.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
